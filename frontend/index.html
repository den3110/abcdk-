<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="google-site-verification"
      content="htFLVLLF-G9pG1K6NpGJ8Tay_M__TQoNf95gqJf04PM"
    />

    <!-- ===== Favicon & Icons ===== -->
    <link rel="icon" type="image/png" href="/favicon-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Pickletour" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- ===== Primary Meta Tags ===== -->
    <title>
      Pickletour.vn - Kết nối cộng đồng &amp; quản lý giải đấu Pickleball
    </title>
    <meta
      name="description"
      content="Nền tảng quản lý giải đấu Pickleball hàng đầu Việt Nam. Đăng ký giải đấu, theo dõi bảng xếp hạng, xem trực tiếp và kết nối cộng đồng thể thao."
    />
    <meta
      name="keywords"
      content="pickleball, giải đấu pickleball, bảng xếp hạng pickleball, pickletour, thể thao, quản lý giải đấu, pickleball việt nam, đăng ký giải đấu, điểm trình pickleball, câu lạc bộ pickleball, trực tiếp pickleball"
    />
    <meta name="author" content="Pickletour.vn" />
    <meta
      name="robots"
      content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1"
    />
    <meta name="theme-color" content="#0d6efd" />

    <!-- ===== Open Graph — chỉ giữ tag STATIC.
         Các tag DYNAMIC per-page (og:title/description/image/url + twitter:*
         + canonical) do SEOHead component (react-helmet-async) render động
         theo route để prerender puppeteer capture đúng meta cho từng trang.
         Trước đây hardcode ở đây khiến canonical/og:image không đổi được. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pickletour.vn" />
    <meta property="og:locale" content="vi_VN" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- ===== Language & Geo =====
         Site chỉ có tiếng Việt — chỉ khai báo hreflang vi + x-default.
         Trước đó khai báo en trỏ cùng URL → Google bỏ qua (sai i18n signal). -->
    <link rel="alternate" hreflang="vi" href="https://pickletour.vn/" />
    <link rel="alternate" hreflang="x-default" href="https://pickletour.vn/" />
    <meta name="geo.region" content="VN" />
    <meta name="geo.placename" content="Vietnam" />
    <meta http-equiv="content-language" content="vi" />

    <!-- ===== Structured Data: Organization ===== -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Pickletour",
        "alternateName": "Pickletour.vn",
        "url": "https://pickletour.vn",
        "logo": "https://pickletour.vn/icon-512.png",
        "description": "Nền tảng quản lý giải đấu Pickleball hàng đầu Việt Nam",
        "contactPoint": {
          "@type": "ContactPoint",
          "email": "support@pickletour.vn",
          "contactType": "customer support",
          "availableLanguage": "Vietnamese"
        }
      }
    </script>

    <!-- ===== Structured Data: WebSite + SearchAction ===== -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Pickletour.vn",
        "url": "https://pickletour.vn",
        "description": "Nền tảng quản lý giải đấu Pickleball hàng đầu Việt Nam",
        "inLanguage": "vi"
      }
    </script>
    <!-- Nền tối khớp splash Astryx CHỈ khi React chưa mount (chống chớp trắng lúc boot).
         #root có con là selector hết khớp -> body về nền mặc định, trang v1 không bị dải đen. -->
    <style>
      html:has(#root:empty), body:has(#root:empty) { background: #111112; }
    </style>

    <!-- Facebook Pixel Code -->
    <script>
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', '28469951482590991');
      fbq('track', 'PageView');
    </script>
    <!-- End Facebook Pixel Code -->
    <!-- Noscript fallback bỏ đi vì SPA yêu cầu JS mới chạy được; ngoài ra
         parse5 (Vite HTML parser) không cho phép <img> trong <noscript>
         khi noscript nằm trong <head> (HTML5 spec strict). -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
