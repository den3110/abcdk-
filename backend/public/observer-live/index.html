<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PickleTour Live — Observer</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header>
  <div class="row" style="justify-content:space-between">
    <h1><span>●</span> PickleTour Live · Observer</h1>
    <div class="row">
      <input id="key" type="password" placeholder="Observer read key" style="width:220px" />
      <select id="platform"><option value="">Mọi nền tảng</option><option value="ios">iOS</option><option value="android">Android</option></select>
      <label class="muted"><input type="checkbox" id="onlineOnly" /> chỉ online</label>
      <select id="interval"><option value="3000">3s</option><option value="5000" selected>5s</option><option value="10000">10s</option><option value="0">Tắt</option></select>
      <button id="refresh">Làm mới</button>
    </div>
  </div>
  <div class="row" style="margin-top:9px; justify-content:space-between">
    <div class="counts" id="counts"></div>
    <div class="muted" id="status">—</div>
  </div>
</header>
<main id="grid"><div class="empty">Nhập read key rồi bấm Làm mới…</div></main>

<script src="app.js"></script>
</body>
</html>
